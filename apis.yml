aid: knowable
name: Knowable
description: 'Knowable was a mobile audio-learning company that united world-class
  experts, thinkers, and storytellers to produce structured audio courses for curious
  minds — an "audio courses" take on online learning delivered as serialized lessons
  rather than one-off podcasts. Founded by the Bit Kitchen team and backed by Andreessen
  Horowitz (a16z led its round in May 2019), Knowable published expert-led course
  series across business, creativity, and personal development. The company is no
  longer operational: knowable.fyi now serves a tombstone notice stating that Knowable
  has been acquired by Medium and directing former listeners to Medium.com. Knowable
  never published a public developer program, API, SDKs, or developer documentation,
  and its GitHub organization (bitkitchen) exposes no public repositories. This
  profile is retained in the API Evangelist network as a historical company record
  from the a16z portfolio; there is no live API surface to catalog.'
